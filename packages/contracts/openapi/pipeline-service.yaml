# =============================================================================
# Contrato do pipeline-service (RNF02).
# Estado: EM CONSTRUCAO - clientes (RF01), o contexto de demandas (RF02) e a
# persistencia das fontes brutas (RF09) estao implementados e verificados contra o
# openapi.json do servico; os demais caminhos vem conforme os cards avancam.
# Mudanca aqui exige PR revisado antes de qualquer implementacao.
# =============================================================================
openapi: 3.1.0

info:
  title: pipeline-service
  version: 1.0.0
  description: |
    CRM, pipeline e artefatos versionados.
    Requisitos atendidos: RF01-RF08, RF13, RF15.
  contact:
    name: Projeto Integrador de Extensao IV - Equipe 6

servers:
  - url: http://localhost:8001
    description: Desenvolvimento local
  - url: http://pipeline-service:8001
    description: Rede interna do Docker Compose

tags:
  - name: health
    description: Liveness e readiness
  - name: raw-inputs
    description: |
      Fontes brutas de uma demanda (RF09). Rota interna: quem capta e o
      ingestion-service, que persiste aqui antes de normalizar ou chamar a IA.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags:
      - health
      summary: Health
      description: Confirma que o processo HTTP esta apto a responder.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /api/v1/demands/{demand_id}/artifacts:
    post:
      tags:
      - artifacts
      summary: Persistir resultado da IA
      description: Grava atomicamente a resposta bruta, o resultado estruturado validado e os vinculos
        com todas as fontes da demanda usadas pela IA.
      operationId: create_artifact_result_api_v1_demands__demand_id__artifacts_post
      parameters:
      - name: demand_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Demand Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactResultCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactRead'
        '404':
          description: Demanda ou fonte inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactErrorResponse'
        '409':
          description: Fonte de outra demanda ou conflito de persistencia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactErrorResponse'
        '422':
          description: Resultado ou identificadores invalidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactErrorResponse'
    get:
      tags:
      - artifacts
      summary: Consultar resultados da demanda
      description: Recupera resultados brutos e estruturados com as fontes que originaram cada artefato.
      operationId: list_demand_artifacts_api_v1_demands__demand_id__artifacts_get
      parameters:
      - name: demand_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Demand Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArtifactRead'
                title: Response List Demand Artifacts Api V1 Demands  Demand Id  Artifacts Get
        '404':
          description: Demanda inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactErrorResponse'
        '422':
          description: Identificador invalido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactErrorResponse'
  /api/v1/clients:
    post:
      tags:
      - clients
      summary: Cadastrar cliente
      description: Cadastra a identificacao, os contatos e o segmento de uma empresa cliente.
      operationId: create_client_api_v1_clients_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRead'
        '409':
          description: CNPJ duplicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Dados de entrada invalidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - clients
      summary: Listar clientes
      description: Lista clientes com paginacao deterministica.
      operationId: list_clients_api_v1_clients_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Pagina iniciada em 1.
          default: 1
          title: Page
        description: Pagina iniciada em 1.
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Itens por pagina.
          default: 20
          title: Size
        description: Itens por pagina.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientPage'
        '422':
          description: Paginacao invalida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/clients/{client_id}:
    get:
      tags:
      - clients
      summary: Consultar cliente por identificador
      description: Retorna os dados cadastrais usados pela tela de detalhe do cliente.
      operationId: get_client_api_v1_clients__client_id__get
      parameters:
      - name: client_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Client Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRead'
        '404':
          description: Cliente inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Identificador invalido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - clients
      summary: Editar dados de um cliente
      description: Altera somente os campos enviados. Campos opcionais enviados como null sao limpos;
        a inativacao pertence ao RF01.3 e nao e realizada por esta operacao.
      operationId: update_client_api_v1_clients__client_id__patch
      parameters:
      - name: client_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Client Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRead'
        '404':
          description: Cliente inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: CNPJ duplicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Dados de entrada invalidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/demands:
    get:
      tags:
      - demands
      summary: Listar e filtrar demandas
      description: Lista demandas por cliente, etapa, responsavel, periodo de criacao e situacao. Os filtros
        informados sao combinados com AND.
      operationId: list_demands_api_v1_demands_get
      parameters:
      - name: client_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Client Id
      - name: stage
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/PipelineStage'
          - type: 'null'
          title: Stage
      - name: owner_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Owner Id
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Inicio inclusivo do periodo de criacao, com fuso.
          title: From
        description: Inicio inclusivo do periodo de criacao, com fuso.
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Fim inclusivo do periodo de criacao, com fuso.
          title: To
        description: Fim inclusivo do periodo de criacao, com fuso.
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/DemandStatus'
          - type: 'null'
          description: Situacao atual da demanda.
          title: Status
        description: Situacao atual da demanda.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_DemandRead_'
        '422':
          description: Filtros invalidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - demands
      summary: Criar demanda vinculada a cliente
      description: Cria uma negociacao com cliente obrigatorio, na situacao ABERTA e etapa CAPTACAO. description
        registra o contexto; owner_id indica um usuario responsavel existente.
      operationId: create_demand_api_v1_demands_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandRead'
        '404':
          description: Cliente ou responsavel inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Referencia removida durante a criacao.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Dados de entrada invalidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/demands/{demand_id}:
    get:
      tags:
      - demands
      summary: Consultar contexto da demanda
      description: Retorna o contexto da demanda, o cliente, a etapa corrente e os artefatos vinculados
        com suas versoes.
      operationId: get_demand_api_v1_demands__demand_id__get
      parameters:
      - name: demand_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Demand Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandDetail'
        '404':
          description: Demanda inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Identificador invalido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - demands
      summary: Editar contexto da demanda
      description: Altera somente os campos enviados. description e owner_id enviados como null sao limpos;
        etapa, situacao, cliente e artefatos permanecem inalterados.
      operationId: update_demand_api_v1_demands__demand_id__patch
      parameters:
      - name: demand_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Demand Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandDetail'
        '404':
          description: Demanda ou responsavel inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Dados de entrada invalidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/demands/{demand_id}/raw-inputs:
    post:
      tags:
      - raw-inputs
      summary: Persistir texto bruto de uma demanda
      description: Rota interna consumida pelo ingestion-service. Confirma a persistencia do conteudo
        original antes que qualquer normalizacao ou chamada a IA possa ocorrer.
      operationId: create_raw_input_api_v1_demands__demand_id__raw_inputs_post
      parameters:
      - name: demand_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Demand Id
      - name: X-User-ID
        in: header
        required: true
        schema:
          type: string
          format: uuid
          title: X-User-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RawInputCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawInputRead'
        '404':
          description: Demanda ou operador inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawInputErrorResponse'
        '409':
          description: Referencia removida durante a persistencia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawInputErrorResponse'
        '422':
          description: Conteudo, origem ou identificador invalido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawInputErrorResponse'
  /api/v1/raw-inputs/{raw_input_id}/normalization:
    patch:
      tags:
      - raw-inputs
      summary: Persistir texto sanitizado
      description: Preenche normalized_content depois da persistencia do original. Esta operacao nunca
        altera original_content.
      operationId: normalize_raw_input_api_v1_raw_inputs__raw_input_id__normalization_patch
      parameters:
      - name: raw_input_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Raw Input Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RawInputNormalization'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawInputRead'
        '404':
          description: Fonte bruta inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawInputErrorResponse'
        '422':
          description: Conteudo normalizado ou identificador invalido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawInputErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token emitido pelo gateway-service (RF16).
  schemas:
    ArtifactErrorDetails:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        details:
          additionalProperties:
            type: string
          type: object
          title: Details
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
      type: object
      required:
      - code
      - message
      title: ArtifactErrorDetails
    ArtifactErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ArtifactErrorDetails'
      type: object
      required:
      - error
      title: ArtifactErrorResponse
    ArtifactOrigin:
      type: string
      enum:
      - IA
      - HUMANO
      title: ArtifactOrigin
      description: Autores logicos possiveis para uma versao de artefato.
    ArtifactRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        demand_id:
          type: string
          format: uuid
          title: Demand Id
        type:
          $ref: '#/components/schemas/ArtifactType'
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        created_at:
          type: string
          format: date-time
          title: Created At
        sources:
          items:
            $ref: '#/components/schemas/ArtifactSourceRead'
          type: array
          title: Sources
        versions:
          items:
            $ref: '#/components/schemas/ArtifactVersionRead'
          type: array
          title: Versions
      type: object
      required:
      - id
      - demand_id
      - type
      - title
      - created_at
      - sources
      - versions
      title: ArtifactRead
      description: Artefato recuperavel pela demanda, com fontes e versoes.
    ArtifactResultCreate:
      properties:
        type:
          $ref: '#/components/schemas/ArtifactType'
          default: REQUISITOS_EXTRAIDOS
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        raw_output:
          type: string
          minLength: 1
          title: Raw Output
          description: Resposta integral devolvida pelo LLM.
        structured_content:
          additionalProperties: true
          type: object
          title: Structured Content
          description: Resultado ja validado contra o schema canonico.
        raw_input_ids:
          items:
            type: string
            format: uuid
          type: array
          minItems: 1
          title: Raw Input Ids
          description: Fontes da mesma demanda utilizadas na geracao.
        ai_metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Ai Metadata
          description: Modelo, prompt, tokens e latencia da execucao.
      additionalProperties: false
      type: object
      required:
      - raw_output
      - structured_content
      - raw_input_ids
      title: ArtifactResultCreate
      description: Resultado bruto e estruturado, mais todas as fontes que o produziram.
    ArtifactSourceRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        source:
          $ref: '#/components/schemas/RawInputSource'
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - source
      - created_at
      title: ArtifactSourceRead
      description: Referencia suficiente para recuperar e auditar uma fonte usada.
    ArtifactType:
      type: string
      enum:
      - DEMANDA_BRUTA
      - REQUISITOS_EXTRAIDOS
      - EMENTA
      - PROPOSTA
      - OUTRO
      title: ArtifactType
      description: Naturezas aceitas para um artefato consolidado (RF15).
    ArtifactVersionRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        number:
          type: integer
          title: Number
        raw_output:
          type: string
          title: Raw Output
        structured_content:
          additionalProperties: true
          type: object
          title: Structured Content
        origin:
          $ref: '#/components/schemas/ArtifactOrigin'
        ai_metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Ai Metadata
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - number
      - raw_output
      - structured_content
      - origin
      - ai_metadata
      - created_at
      title: ArtifactVersionRead
      description: Primeira versao atomica do resultado da IA.
    ClientCreate:
      properties:
        name:
          type: string
          minLength: 1
          title: Name
        cnpj:
          anyOf:
          - type: string
          - type: 'null'
          title: Cnpj
        segment:
          anyOf:
          - type: string
          - type: 'null'
          title: Segment
        contact_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Contact Name
        contact_email:
          anyOf:
          - type: string
          - type: 'null'
          title: Contact Email
        contact_phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Contact Phone
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
      additionalProperties: false
      type: object
      required:
      - name
      title: ClientCreate
      description: Dados cadastrais recebidos pelo fluxo dependente RF01.1.
    ClientPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ClientRead'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        size:
          type: integer
          title: Size
      type: object
      required:
      - items
      - total
      - page
      - size
      title: ClientPage
      description: Pagina estavel para a consulta de clientes.
    ClientRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        cnpj:
          anyOf:
          - type: string
          - type: 'null'
          title: Cnpj
        segment:
          anyOf:
          - type: string
          - type: 'null'
          title: Segment
        contact_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Contact Name
        contact_email:
          anyOf:
          - type: string
          - type: 'null'
          title: Contact Email
        contact_phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Contact Phone
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
        active:
          type: boolean
          title: Active
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - name
      - cnpj
      - segment
      - contact_name
      - contact_email
      - contact_phone
      - notes
      - active
      - created_at
      - updated_at
      title: ClientRead
      description: Representacao completa usada na listagem e na tela de detalhe.
    ClientUpdate:
      properties:
        name:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Name
        cnpj:
          anyOf:
          - type: string
          - type: 'null'
          title: Cnpj
        segment:
          anyOf:
          - type: string
          - type: 'null'
          title: Segment
        contact_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Contact Name
        contact_email:
          anyOf:
          - type: string
          - type: 'null'
          title: Contact Email
        contact_phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Contact Phone
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
      additionalProperties: false
      type: object
      title: ClientUpdate
      description: Edicao parcial; campos omitidos permanecem inalterados (RF01.2).
    DemandArtifactRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        type:
          type: string
          title: Type
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        raw_input_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Raw Input Id
        created_at:
          type: string
          format: date-time
          title: Created At
        versions:
          items:
