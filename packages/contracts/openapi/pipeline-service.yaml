# =============================================================================
# Contrato do pipeline-service (RNF02).
# Estado: ESQUELETO - os caminhos sao definidos na Fase 2 (ate 15/09).
# Mudanca aqui exige PR revisado antes de qualquer implementacao.
# =============================================================================
openapi: 3.1.0

info:
  title: pipeline-service
  version: 1.0.0
  description: |
    CRM, pipeline e artefatos versionados.
    Requisitos atendidos: RF01-RF08, RF13, RF15.
  contact:
    name: Projeto Integrador de Extensao IV - Equipe 6

servers:
  - url: http://localhost:8001
    description: Desenvolvimento local
  - url: http://pipeline-service:8001
    description: Rede interna do Docker Compose

tags:
  - name: health
    description: Liveness e readiness
  - name: clients
    description: Cadastro de empresas clientes

security:
  - bearerAuth: []

paths:
  /api/v1/clients:
    post:
      tags: [clients]
      summary: Cadastra uma empresa cliente
      operationId: createClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreate'
      responses:
        '201':
          description: Cliente cadastrado
          headers:
            Location:
              description: Caminho do cliente criado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRead'
        '409':
          description: CNPJ ja cadastrado
        '422':
          description: Dados de entrada invalidos

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token emitido pelo gateway-service (RF16).
  schemas:
    ClientCreate:
      type: object
      required: [nome]
      properties:
        nome: {type: string, minLength: 1}
        cnpj: {type: [string, 'null'], pattern: '^([0-9]{14}|[0-9]{2}\\.[0-9]{3}\\.[0-9]{3}/[0-9]{4}-[0-9]{2})$'}
        segmento: {type: [string, 'null']}
        contato_nome: {type: [string, 'null']}
        contato_email: {type: [string, 'null'], format: email}
        contato_telefone: {type: [string, 'null']}
        observacoes: {type: [string, 'null']}
    ClientRead:
      allOf:
        - $ref: '#/components/schemas/ClientCreate'
        - type: object
          required: [id, ativo, created_at, updated_at]
          properties:
            id: {type: string, format: uuid}
            ativo: {type: boolean}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
