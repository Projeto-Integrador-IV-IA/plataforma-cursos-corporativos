# =============================================================================
# Contrato do pipeline-service (RNF02).
# Estado: EM CONSTRUCAO - criacao (RF02) e listagem filtrada (RF03) de demandas
# estao verificadas contra o openapi.json do servico; os demais caminhos seguem pendentes.
# Mudanca aqui exige PR revisado antes de qualquer implementacao.
# =============================================================================
openapi: 3.1.0

info:
  title: pipeline-service
  version: 1.0.0
  description: |
    CRM, pipeline e artefatos versionados.
    Requisitos atendidos: RF01-RF08, RF13, RF15.
  contact:
    name: Projeto Integrador de Extensao IV - Equipe 6

servers:
  - url: http://localhost:8001
    description: Desenvolvimento local
  - url: http://pipeline-service:8001
    description: Rede interna do Docker Compose

tags:
  - name: health
    description: Liveness e readiness

security:
  - bearerAuth: []

paths:
  /api/v1/demands:
    get:
      tags:
      - demands
      summary: Listar e filtrar demandas
      description: Lista demandas por cliente, etapa, responsavel, periodo de criacao
        e situacao. Os filtros informados sao combinados com AND.
      operationId: list_demands_api_v1_demands_get
      parameters:
      - name: client_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Client Id
      - name: stage
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/PipelineStage'
          - type: 'null'
          title: Stage
      - name: owner_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Owner Id
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Inicio inclusivo do periodo de criacao, com fuso.
          title: From
        description: Inicio inclusivo do periodo de criacao, com fuso.
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Fim inclusivo do periodo de criacao, com fuso.
          title: To
        description: Fim inclusivo do periodo de criacao, com fuso.
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/DemandStatus'
          - type: 'null'
          description: Situacao atual da demanda.
          title: Status
        description: Situacao atual da demanda.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_DemandRead_'
        '422':
          description: Filtros invalidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandErrorResponse'
    post:
      tags:
      - demands
      summary: Criar demanda vinculada a cliente
      description: Cria uma negociacao com cliente obrigatorio, na situacao ABERTA
        e etapa CAPTACAO. description registra o contexto; owner_id indica um usuario
        responsavel existente.
      operationId: create_demand_api_v1_demands_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandRead'
        '404':
          description: Cliente ou responsavel inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandErrorResponse'
        '409':
          description: Referencia removida durante a criacao.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandErrorResponse'
        '422':
          description: Dados de entrada invalidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandErrorResponse'
# TODO(Fase 2): declarar os demais caminhos conforme docs/02-arquitetura/contratos-api.md

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token emitido pelo gateway-service (RF16).
  schemas:
    DemandCreate:
      properties:
        client_id:
          type: string
          format: uuid
          title: Client Id
          description: Identificador de um cliente existente. Obrigatorio.
        title:
          type: string
          minLength: 1
          title: Title
          description: Titulo da negociacao.
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Contexto da negociacao.
        owner_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Owner Id
          description: Identificador do usuario responsavel.
      additionalProperties: false
      type: object
      required:
      - client_id
      - title
      title: DemandCreate
      description: Dados da negociacao; situacao e etapa inicial sao definidas pelo
        servico.
    DemandErrorDetails:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        details:
          additionalProperties:
            type: string
          type: object
          title: Details
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
      type: object
      required:
      - code
      - message
      title: DemandErrorDetails
      description: Erro previsivel, sem detalhes internos do banco.
    DemandErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/DemandErrorDetails'
      type: object
      required:
      - error
      title: DemandErrorResponse
      description: Envelope de erro acordado para a plataforma (RNF02).
    DemandRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        client_id:
          type: string
          format: uuid
          title: Client Id
        title:
          type: string
          title: Title
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        owner_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Owner Id
        status:
          $ref: '#/components/schemas/DemandStatus'
        current_stage:
          $ref: '#/components/schemas/PipelineStage'
        active:
          type: boolean
          title: Active
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - client_id
      - title
      - description
      - owner_id
      - status
      - current_stage
      - active
      - created_at
      - updated_at
      title: DemandRead
      description: Demanda persistida, com situacao, etapa corrente e vinculo ao cliente.
    DemandStatus:
      type: string
      enum:
      - ABERTA
      - GANHA
      - PERDIDA
      - CANCELADA
      title: DemandStatus
      description: Situacoes da demanda, ortogonais a etapa corrente.
    PipelineStage:
      type: string
      enum:
      - CAPTACAO
      - ESTRUTURACAO
      - PRODUTO
      - PROPOSTA
      - ACOMPANHAMENTO
      title: PipelineStage
      description: Etapas percorridas por uma demanda no pipeline (RF05).
    PaginatedResponse_DemandRead_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/DemandRead'
          type: array
          title: Items
        total:
          type: integer
          minimum: 0.0
          title: Total
          description: Total de registros que atendem aos filtros.
        page:
          type: integer
          minimum: 1.0
          title: Page
          description: Pagina atual, calculada a partir de offset e limit.
        size:
          type: integer
          minimum: 1.0
          title: Size
          description: Limite de registros solicitado por pagina.
      type: object
      required:
      - items
      - total
      - page
      - size
      title: PaginatedResponse[DemandRead]
  # TODO(Fase 2): referenciar ../schemas/*.json para os demais artefatos
