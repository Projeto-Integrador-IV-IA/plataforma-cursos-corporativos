# =============================================================================
# Contrato do ingestion-service (RNF02).
# Captacao (RF09), inferencia da origem (RF10, #31), sanitizacao (RF11) e
# validacao das fontes (RF12) estao implementadas. Ordenacao (#32) e
# reprocessamento seguem como entregas futuras.
# Operacoes e schemas sao verificados contra o openapi.json do servico.
# Mudanca aqui exige PR revisado antes de qualquer implementacao.
# =============================================================================
openapi: 3.1.0

info:
  title: ingestion-service
  version: 1.0.0
  description: |
    Ingestao e normalizacao da demanda bruta.
    Requisitos atendidos: RF09, RF10, RF11, RF12.
  contact:
    name: Projeto Integrador de Extensao IV - Equipe 6

servers:
  - url: http://localhost:8002
    description: Desenvolvimento local
  - url: http://ingestion-service:8002
    description: Rede interna do Docker Compose

tags:
  - name: health
    description: Liveness e readiness
  - name: ingestion
    description: |
      Porta de entrada do texto bruto multicanal (RF09). A captacao so e
      confirmada depois que o pipeline-service commita o original.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags:
      - health
      summary: Health
      description: Confirma que o processo HTTP esta apto a responder.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /api/v1/ingestion:
    post:
      tags:
      - ingestion
      summary: Captar texto bruto multicanal
      description: Persiste o texto original no pipeline-service e somente entao confirma a captacao.
        Nenhuma normalizacao ou chamada a IA ocorre antes desse commit.
      operationId: capture_raw_text_api_v1_ingestion_post
      parameters:
      - name: X-User-ID
        in: header
        required: true
        schema:
          type: string
          format: uuid
          title: X-User-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestionCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionRead'
        '404':
          description: Demanda, operador ou tentativa anterior inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Referencia removida ou tentativa anterior de outra demanda.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Texto, origem, demanda ou operador invalido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Falha de comunicacao ou resposta invalida do pipeline-service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Timeout ao persistir no pipeline-service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/ingestion/audio:
    post:
      tags:
      - ingestion
      summary: Captar arquivo de audio como fonte da demanda
      description: 'Valida formato, tamanho e duracao e persiste o arquivo original
        e a proveniencia antes de qualquer transcricao. STT permanece PENDENTE (card
        #165).'
      operationId: capture_audio_api_v1_ingestion_audio_post
      parameters:
      - name: X-User-ID
        in: header
        required: true
        schema:
          type: string
          format: uuid
          title: X-User-Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_capture_audio_api_v1_ingestion_audio_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioIngestionRead'
        '404':
          description: Demanda ou operador inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflito de referencia durante a persistencia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Audio excede o tamanho maximo configurado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Audio, duracao ou identificadores invalidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Pipeline indisponivel ou confirmacao invalida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Timeout ao confirmar persistencia do audio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token emitido pelo gateway-service (RF16).
  schemas:
    ErrorBody:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
      type: object
      required:
      - code
      - message
      title: ErrorBody
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      type: object
      required:
      - error
      title: ErrorResponse
    IngestionCreate:
      properties:
        text:
          type: string
          maxLength: 50000
          minLength: 10
          title: Text
          description: Texto bruto preservado sem alteracoes. Deve conter pelo menos 10 caracteres nao brancos e no maximo 50.000 caracteres no total.
        source_type:
          anyOf:
          - $ref: '#/components/schemas/SourceKind'
          - type: 'null'
          description: Canal declarado pelo operador; ausente ou nulo permite inferencia pelo formato do texto.
        demand_id:
          type: string
          format: uuid
          title: Demand Id
          description: Demanda existente no pipeline-service.
        previous_attempt_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Previous Attempt Id
          description: Tentativa anterior da mesma demanda, quando esta captacao for reprocessamento.
      additionalProperties: false
      type: object
      required:
      - text
      - demand_id
      title: IngestionCreate
      description: Texto, origem opcional e demanda de destino; a declaracao prevalece sobre a inferencia.
    IngestionRead:
      properties:
        raw_input_id:
          type: string
          format: uuid
          title: Raw Input Id
        demand_id:
          type: string
          format: uuid
          title: Demand Id
        source_type:
          $ref: '#/components/schemas/SourceKind'
        previous_attempt_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Previous Attempt Id
        status:
          type: string
          const: RECEBIDA
          title: Status
          default: RECEBIDA
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - raw_input_id
      - demand_id
      - source_type
      - previous_attempt_id
      - created_at
      title: IngestionRead
      description: Resposta emitida somente depois da confirmacao do pipeline-service.
    SourceKind:
      type: string
      enum:
      - EMAIL
      - TRANSCRICAO
      - MENSAGENS
      - ANOTACAO
      - OUTRO
      - AUDIO
      title: SourceKind
      description: Origens aceitas, alinhadas ao vocabulario persistido pelo pipeline.
    AudioIngestionRead:
      properties:
        raw_input_id:
          type: string
          format: uuid
          title: Raw Input Id
        demand_id:
          type: string
          format: uuid
          title: Demand Id
        source_type:
          type: string
          const: AUDIO
          title: Source Type
          default: AUDIO
        author_id:
          type: string
          format: uuid
          title: Author Id
        received_order:
          type: integer
          minimum: 1.0
          title: Received Order
        created_at:
          type: string
          format: date-time
          title: Created At
        status:
          type: string
          const: RECEBIDA
          title: Status
          default: RECEBIDA
        transcription_status:
          type: string
          const: PENDENTE
          title: Transcription Status
          default: PENDENTE
        audio:
          $ref: '#/components/schemas/AudioMetadata'
      type: object
      required:
      - raw_input_id
      - demand_id
      - author_id
      - received_order
      - created_at
      - audio
      title: AudioIngestionRead
      description: 'Arquivo confirmado; a integracao STT pertence ao card #165.'
    AudioMetadata:
      properties:
        filename:
          type: string
          maxLength: 255
          minLength: 1
          title: Filename
        content_type:
          type: string
          title: Content Type
        size_bytes:
          type: integer
          exclusiveMinimum: 0.0
          title: Size Bytes
        duration_seconds:
          type: number
          exclusiveMinimum: 0.0
          title: Duration Seconds
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
          title: Sha256
      type: object
      required:
      - filename
      - content_type
      - size_bytes
      - duration_seconds
      - sha256
      title: AudioMetadata
    Body_capture_audio_api_v1_ingestion_audio_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
          description: Arquivo WAV, MP3, M4A, OGG ou FLAC.
        demand_id:
          type: string
          format: uuid
          title: Demand Id
      type: object
      required:
      - file
      - demand_id
      title: Body_capture_audio_api_v1_ingestion_audio_post
