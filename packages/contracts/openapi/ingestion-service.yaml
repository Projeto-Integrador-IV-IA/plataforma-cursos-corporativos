# =============================================================================
# Contrato do ingestion-service (RNF02).
# Estado: EM CONSTRUCAO.
#   IMPLEMENTADO - captacao de texto bruto (RF09), verificada contra o
#   openapi.json do servico.
#   PREVISTO - consulta de fonte com proveniencia (RF10, cards #31 e #32) e
#   reprocessamento apos erro ou atualizacao (RF12, card #36). Declarados aqui
#   antes do codigo, conforme RNF02.
# Mudanca aqui exige PR revisado antes de qualquer implementacao.
# =============================================================================
openapi: 3.1.0

info:
  title: ingestion-service
  version: 1.1.0
  description: |
    Ingestao e normalizacao da demanda bruta.
    Requisitos atendidos: RF09, RF10, RF12.
  contact:
    name: Projeto Integrador de Extensao IV - Equipe 6

servers:
  - url: http://localhost:8002
    description: Desenvolvimento local
  - url: http://ingestion-service:8002
    description: Rede interna do Docker Compose

tags:
  - name: health
    description: Liveness e readiness
  - name: ingestion
    description: |
      Porta de entrada do texto bruto multicanal (RF09). A captacao so e
      confirmada depois que o pipeline-service commita o original.
  - name: sources
    description: |
      Consulta e reprocessamento das fontes ja captadas (RF10, RF12).
      PREVISTO - cards #31, #32 e #36.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags:
      - health
      summary: Health
      description: Confirma que o processo HTTP esta apto a responder.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /api/v1/ingestion:
    post:
      tags:
      - ingestion
      summary: Captar texto bruto multicanal
      description: Persiste o texto original no pipeline-service e somente entao confirma a captacao.
        Nenhuma normalizacao ou chamada a IA ocorre antes desse commit.
      operationId: capture_raw_text_api_v1_ingestion_post
      parameters:
      - name: X-User-ID
        in: header
        required: true
        schema:
          type: string
          format: uuid
          title: X-User-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestionCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionRead'
        '404':
          description: Demanda ou operador inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Referencia removida durante a persistencia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Texto, origem, demanda ou operador invalido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Falha de comunicacao ou resposta invalida do pipeline-service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Timeout ao persistir no pipeline-service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/sources/{source_id}:
    get:
      tags:
      - sources
      summary: Consultar fonte captada
      description: |
        Devolve a fonte com sua proveniencia (RF10), o conteudo original preservado
        e o conteudo normalizado quando houver. PREVISTO - cards #31 e #32.
      operationId: get_source_api_v1_sources_source_id_get
      parameters:
      - name: source_id
        in: path
        required: true
        description: Identificador da fonte - o mesmo raw_input_id devolvido na captacao.
        schema:
          type: string
          format: uuid
          title: Source Id
      responses:
        '200':
          description: Fonte recuperada com proveniencia e conteudos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceResponse'
        '401':
          description: Token ausente, expirado ou sem autorizacao.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Fonte inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Falha interna ao recuperar a fonte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/sources/{source_id}/reprocess:
    post:
      tags:
      - sources
      summary: Reprocessar fonte apos erro ou atualizacao
      description: |
        Dispara nova normalizacao da fonte. O reprocessamento gera registro novo e
        nao apaga a tentativa anterior (RNF09). PREVISTO - card #36.
      operationId: reprocess_source_api_v1_sources_source_id_reprocess_post
      parameters:
      - name: source_id
        in: path
        required: true
        description: Identificador da fonte a reprocessar.
        schema:
          type: string
          format: uuid
          title: Source Id
      requestBody:
        required: false
        description: Parametros opcionais para orientar o reprocessamento.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReprocessSourceRequest'
      responses:
        '200':
          description: Reprocessamento aceito; estado corrente da fonte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceResponse'
        '401':
          description: Token ausente, expirado ou sem autorizacao.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Fonte inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Parametros de reprocessamento invalidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Falha interna ao reprocessar a fonte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token emitido pelo gateway-service (RF16).
  schemas:
    ErrorBody:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
      type: object
      required:
      - code
      - message
      title: ErrorBody
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      type: object
      required:
      - error
      title: ErrorResponse
    IngestionCreate:
      properties:
        text:
          type: string
          minLength: 1
          title: Text
          description: Texto bruto preservado sem alteracoes.
        source_type:
          $ref: '#/components/schemas/SourceKind'
          description: Canal de origem declarado pelo operador.
        demand_id:
          type: string
          format: uuid
          title: Demand Id
          description: Demanda existente no pipeline-service.
      additionalProperties: false
      type: object
      required:
      - text
      - source_type
      - demand_id
      title: IngestionCreate
      description: Texto, origem declarada e demanda de destino.
    IngestionRead:
      properties:
        raw_input_id:
          type: string
          format: uuid
          title: Raw Input Id
        demand_id:
          type: string
          format: uuid
          title: Demand Id
        source_type:
          $ref: '#/components/schemas/SourceKind'
        status:
          type: string
          const: RECEBIDA
          title: Status
          default: RECEBIDA
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - raw_input_id
      - demand_id
      - source_type
      - created_at
      title: IngestionRead
      description: Resposta emitida somente depois da confirmacao do pipeline-service.
    SourceKind:
      type: string
      enum:
      - EMAIL
      - TRANSCRICAO
      - MENSAGENS
      - ANOTACAO
      - OUTRO
      title: SourceKind
      description: Origens aceitas, alinhadas ao vocabulario persistido pelo pipeline.
    SourceStatus:
      type: string
      enum:
      - RECEBIDA
      - NORMALIZANDO
      - NORMALIZADA
      - FALHA
      title: SourceStatus
      description: |
        Estado da fonte no ciclo de normalizacao. RECEBIDA e o estado devolvido pela
        captacao; os demais sao previstos pelos cards #33, #34 e #36.
    Provenance:
      type: object
      description: Proveniencia da fonte captada (RF10) - origem, autor e momento.
      required:
      - channel
      - captured_at
      properties:
        channel:
          type: string
          title: Channel
          description: Canal de entrada do contato com o cliente.
        origin_sender:
          anyOf:
          - type: string
          - type: 'null'
          title: Origin Sender
          description: Remetente original - e-mail, numero ou nome.
        collected_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Collected By
          description: Operador ou integracao que captou o registro.
        captured_at:
          type: string
          format: date-time
          title: Captured At
          description: Momento em que o insumo foi recebido.
        sequence:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sequence
          description: Ordem de recebimento da fonte dentro da demanda (card #32).
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
          description: Informacoes adicionais especificas do canal de origem.
      title: Provenance
    ReprocessSourceRequest:
      type: object
      additionalProperties: false
      properties:
        force:
          type: boolean
          default: false
          title: Force
          description: Reprocessa mesmo que a fonte ja esteja normalizada.
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Motivo do reprocessamento, registrado para auditoria.
      title: ReprocessSourceRequest
      description: Parametros opcionais do reprocessamento.
    SourceResponse:
      type: object
      required:
      - source_id
      - demand_id
      - source_type
      - raw_content
      - status
      - provenance
      - created_at
      properties:
        source_id:
          type: string
          format: uuid
          title: Source Id
          description: Identificador da fonte - o mesmo raw_input_id da captacao.
        demand_id:
          type: string
          format: uuid
          title: Demand Id
        source_type:
          $ref: '#/components/schemas/SourceKind'
        raw_content:
          type: string
          title: Raw Content
          description: Conteudo original preservado, nunca sobrescrito pela normalizacao.
        normalized_content:
          anyOf:
          - type: string
          - type: 'null'
          title: Normalized Content
          description: Conteudo normalizado pronto para a IA; nulo enquanto pendente.
        status:
          $ref: '#/components/schemas/SourceStatus'
        provenance:
          $ref: '#/components/schemas/Provenance'
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
      title: SourceResponse
      description: Fonte captada com proveniencia, conteudos e estado corrente.
