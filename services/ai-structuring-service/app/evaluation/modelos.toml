# =============================================================================
# Catalogo de modelos candidatos a avaliacao (RNF04, card #216).
#
# Lido por app/evaluation/catalog.py. Versionado de proposito: comparacao de
# modelo so e defensavel se outra pessoa conseguir repetir a medicao com a
# mesma lista.
#
# PRECO CONSULTADO DIRETO NA API PUBLICA DO OPENROUTER
# (https://openrouter.ai/api/v1/models, campo `pricing`, USD por token -
# convertido para USD por milhao de tokens aqui). Preco de API muda; se
# `preco_consultado_em` ficar velho (meses, nao dias), reconsultar e
# atualizar os tres campos juntos - foi a falta de data e fonte que a
# revisao do levantamento de custos (card #121) apontou. Os quatro primeiros
# modelos foram consultados em 2026-10-27; os tres da disputa interna
# DeepSeek (card #220), em 2026-11-04.
#
# Os slugs seguem a convencao vendor/modelo do OpenRouter. `google/gemini-2.0
# -flash-001`, o terceiro candidato original, foi descontinuado pelo OpenRouter
# entre a criacao deste catalogo e esta consulta (pagina do modelo devolve 404,
# e nao aparece mais na busca) - substituido por `google/gemini-2.5-flash`,
# mesmo papel na disputa (terceiro fornecedor, janela larga). Confirmar o slug
# na pagina de modelos antes de cada rodada nova: catalogo e a unica fonte
# desses nomes no projeto, e slug errado ou descontinuado falha so na chamada.
# =============================================================================

[[modelo]]
slug = "anthropic/claude-sonnet-4.5"
apelido = "Sonnet 4.5"
justificativa = """
Referencia de qualidade da disputa. Entra como teto: se um modelo mais barato \
chegar perto dele nas metricas, a escolha por custo fica justificada; se nao \
chegar, o projeto sabe o que esta abrindo mao.\
"""
janela_de_contexto = 1000000
usd_por_mtok_entrada = 3.00
usd_por_mtok_saida = 15.00
preco_consultado_em = 2026-10-27

