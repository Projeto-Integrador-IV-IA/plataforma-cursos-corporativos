[project]
name = "ai-structuring-service"
version = "0.1.0"
description = "Estruturacao do curso por LLM: extracao de requisitos, geracao de ementa e metricas de qualidade."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.7",
  # Le o contrato OpenAPI no teste que o compara com o openapi.json do servico.
  "pyyaml>=6.0",
]
# Roda notebooks/avaliacao-de-modelos.ipynb, que compara modelos sobre o conjunto
# de avaliacao (RNF04). Separado de `dev` porque o CI nao executa notebook: quem
# roda a avaliacao instala com `pip install -e ".[dev,avaliacao]"`.
avaliacao = [
  "jupyter>=1.1",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "ipykernel>=6.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# RNF30: a medicao de cobertura vem na propria suite. Rodar `pytest` imprime o
# relatorio com as linhas e os ramos descobertos, na mesma forma em qualquer
# maquina e no CI - sem flag extra e sem depender de quem lembrou de passa-la.
addopts = "-q --cov --cov-report=term-missing"

[tool.coverage.run]
# `--cov` sem valor usa este fonte: so o codigo do servico entra na conta.
source = ["app"]
# Ramo nao exercitado aparece como `136->134` no relatorio; sem isto, um `if`
# cujo caminho falso nunca roda passa por coberto.
branch = true

[tool.coverage.report]
show_missing = true
