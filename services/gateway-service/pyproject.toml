[project]
name = "gateway-service"
version = "0.1.0"
description = "Porta de entrada unica da plataforma: autenticacao, roteamento e agregacao para o frontend."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "pyjwt>=2.9",
  # bcrypt direto, sem passlib: a 1.7.4 (ultima release, de 2020) le a versao
  # do bcrypt por `__about__`, atributo removido na 4.1 e que na 5.0 quebra o
  # hash. Usar a biblioteca do algoritmo evita carregar um wrapper parado.
  "bcrypt>=4.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
