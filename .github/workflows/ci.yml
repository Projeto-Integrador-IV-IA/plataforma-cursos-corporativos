# =============================================================================
# Portao de qualidade dos PRs (RNF14).
# Enquanto os servicos nao tiverem implementacao, os jobs sao tolerantes a
# ausencia de codigo/testes - remova os `continue-on-error` ao iniciar a Fase 3.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway-service
          - ingestion-service
          - ai-structuring-service
          - pipeline-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        working-directory: services/${{ matrix.service }}
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: services/${{ matrix.service }}
        run: ruff check .

      - name: Formatacao (ruff format)
        working-directory: services/${{ matrix.service }}
        run: ruff format --check .

      - name: Testes
        working-directory: services/${{ matrix.service }}
        run: pytest -q
        continue-on-error: true   # TODO: remover na Fase 3, quando houver testes

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        working-directory: web
        run: npm ci || npm install

      - name: Lint
        working-directory: web
        run: npm run lint
        continue-on-error: true   # TODO: remover na Fase 3

      - name: Build
        working-directory: web
        run: npm run build
        continue-on-error: true   # TODO: remover na Fase 3

  seguranca:
    name: Verificacao de segredos (RNF11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bloquear .env versionado
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::arquivo .env versionado - remova do controle de versao (RNF11)"
            exit 1
          fi

      - name: Procurar chaves aparentes no diff
        run: |
          padrao='(sk-[A-Za-z0-9_-]{16,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'
          if git grep -nEI "$padrao" -- ':!*.example' ':!.github/workflows/*' ; then
            echo "::error::possivel segredo commitado (RNF11)"
            exit 1
          fi
          echo "nenhum segredo aparente encontrado"
