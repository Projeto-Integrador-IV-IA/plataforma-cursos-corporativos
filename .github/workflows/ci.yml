# =============================================================================
# Portao de qualidade dos PRs (RNF14).
# Backend e frontend reprovam de fato: nenhum passo tolera falha. No backend
# sao obrigatorios lint, formatacao e testes dos quatro servicos; no frontend,
# lint, testes e build do `web`. Check verde aqui significa codigo verde.
# =============================================================================
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    # O fluxo do projeto abre PR contra `dev`; `main` so recebe release. Sem
    # `dev` aqui, nenhum PR do time passava pelo portao (RNF14).
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway-service
          - ingestion-service
          - ai-structuring-service
          - pipeline-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        working-directory: services/${{ matrix.service }}
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: services/${{ matrix.service }}
        run: ruff check .

      - name: Formatacao (ruff format)
        working-directory: services/${{ matrix.service }}
        run: ruff format --check .

      - name: Testes
        working-directory: services/${{ matrix.service }}
        run: pytest -q

      # RNF30: ai-structuring-service e o unico dos quatro com `--cov`
      # habilitado no `addopts` (pyproject.toml); os outros nao escrevem
      # `.coverage`, por isso o passo e so dele. `always()` para o numero
      # aparecer tambem quando o piso reprova o build, nao so quando passa.
      - name: Publicar cobertura (RNF30)
        if: always() && matrix.service == 'ai-structuring-service'
        working-directory: services/${{ matrix.service }}
        run: |
          total=$(coverage report --format=total)
          {
            echo "### Cobertura - ai-structuring-service"
            echo "Total: ${total}% (piso: 85%, ver \`pyproject.toml\`)"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Sem `|| npm install`: o fallback silencioso escondia lockfile
      # dessincronizado, que e justamente o que o portao deve pegar.
      - name: Instalar dependencias
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Testes
        working-directory: web
        run: npm run test

      - name: Build
        working-directory: web
        run: npm run build

  seguranca:
    name: Verificacao de segredos (RNF11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bloquear arquivos de ambiente e chaves privadas
        run: |
          proibidos=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.(pem|key|p12|pfx)$' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$proibidos" ]; then
            echo "::error::arquivo sensivel versionado (RNF11)"
            echo "$proibidos"
            exit 1
          fi

      - name: Procurar credenciais aparentes no codigo versionado
        env:
          # PR: o commit de onde a mudanca parte. Push: o estado anterior do ref.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # O DSN so conta como credencial quando usuario e senha sao literais.
          # `${VAR}` e `<placeholder>` sao template, nao segredo - eram o falso
          # positivo que mantinha este job vermelho.
          padrao='(sk-[A-Za-z0-9_-]{16,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|gh[pousr]_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|[a-z][a-z0-9+.-]*://[^[:space:]/$<{]+:[^@[:space:]$<{]+@)'

          if git grep -nEI "$padrao" -- ':!*.example' ':!.github/workflows/*' ':!Makefile' ':!web/package-lock.json'; then
            echo "::error::possivel segredo commitado (RNF11)"
            exit 1
          fi

          # Historico: so o que ESTA mudanca acrescenta. Varrer `--all` fazia um
          # unico commit antigo reprovar todo PR para sempre, sem conserto
          # possivel sem reescrever historico - e o proprio commit que removia o
          # segredo tambem reprovava. Aqui olhamos apenas as linhas adicionadas.
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "sem base para comparar; varredura limitada a arvore de trabalho"
            echo "nenhum segredo aparente encontrado"
            exit 0
          fi

          adicionado=$(git diff --unified=0 "$BASE_SHA...HEAD" -- . \
            ':(exclude)*.example' \
            ':(exclude).github/workflows/**' \
            ':(exclude)Makefile' \
            ':(exclude)web/package-lock.json' | grep -E '^\+[^+]' || true)

          if printf '%s\n' "$adicionado" | grep -qE "$padrao"; then
            echo "::error::possivel segredo introduzido nos commits desta mudanca (RNF11)"
            printf '%s\n' "$adicionado" | grep -nE "$padrao"
            exit 1
          fi

          echo "nenhum segredo aparente encontrado"

  fronteira-bloco-b:
    name: Fronteira do nucleo com o Bloco B (RNF13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Custeio, instrutores, proposta comercial e slides sao Bloco B (RF-F1 a
      # RF-F5): fora do MVP, entram depois como servico novo (ADR-0008). Fronteira
      # sem teste volta a vazar, entao a busca reprova o PR. Vocabulario legitimo
      # - texto de cliente em fixture, teste que prova que o contrato recusa campo
      # do Bloco B, diretorio de modulo ja aprovado - fica em
      # .github/fronteira-bloco-b-permitidos.txt: um caminho por linha, com a
      # justificativa depois de `|`. A fala do cliente "depende do orcamento",
      # usada em exemplos de prompt e em fixtures, e permitida em qualquer
      # arquivo (variavel `frases` abaixo).
      - name: Procurar vocabulario do Bloco B no nucleo
        run: |
          # `or[^a-z]{1,2}amento` cobre "orcamento" e "orcamento" com cedilha sem
          # depender de acento neste arquivo.
          padrao='custeio|orcamento|or[^a-z]{1,2}amento|instrutor|proposta comercial|slide'
          lista=.github/fronteira-bloco-b-permitidos.txt
          frases='depende do (orcamento|or[^a-z]{1,2}amento)'

          excecoes=()
          if [ -f "$lista" ]; then
            while IFS= read -r linha || [ -n "$linha" ]; do
              caminho=$(printf '%s' "${linha%%|*}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              case "$caminho" in ''|'#'*) continue ;; esac
              if [ ! -e "$caminho" ]; then
                echo "::warning::caminho da lista de permitidos nao existe mais: $caminho"
              fi
              excecoes+=(":(exclude)$caminho")
            done < "$lista"
          fi

          bruto=$(git grep -nEiI "$padrao" -- services packages web ':(exclude)*package-lock.json' "${excecoes[@]}" || true)
          achados=$(printf '%s\n' "$bruto" | grep -viE "$frases" | grep -E '.' || true)

          if [ -n "$achados" ]; then
            printf '%s\n' "$achados"
            echo "::error::vocabulario do Bloco B no nucleo (ADR-0008)"
            echo "Se for vazamento, remova do nucleo. Se for vocabulario legitimo, registre o arquivo em $lista com a justificativa."
            exit 1
          fi

          echo "nucleo sem vocabulario do Bloco B fora da lista permitida"
